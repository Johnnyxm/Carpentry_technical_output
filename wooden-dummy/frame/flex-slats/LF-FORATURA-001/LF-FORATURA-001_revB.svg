<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="white"/>
<style>
text{font-family:Arial,sans-serif;fill:#111}
.dim{stroke:#1769d2;stroke-width:1.5;fill:none}
.thin{stroke:#111;stroke-width:1;fill:none}
.center{stroke:#1769d2;stroke-width:1;stroke-dasharray:8 5}
.hole{stroke:#111;stroke-width:1.5;fill:white}
.label{font-size:20px;font-weight:700}
.small{font-size:16px}
.tiny{font-size:14px}
.title{font-size:34px;font-weight:700}
</style>
<rect x="8" y="8" width="1584" height="884" class="thin"/>
<text x="800" y="55" text-anchor="middle" class="title">LISTELLO FLETTENTE — FORATURA</text>
